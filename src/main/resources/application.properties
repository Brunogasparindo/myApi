spring.application.name=myApi

# JWT — override app.jwt.secret via environment variable in production (min 32 chars)
app.jwt.secret=please-change-this-secret-in-production!
app.jwt.expiration-ms=900000
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=true
