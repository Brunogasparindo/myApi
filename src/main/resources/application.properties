spring.application.name=myApi

# JWT — override app.jwt.secret via environment variable in production (min 32 chars)
app.jwt.secret=please-change-this-secret-in-production!
app.jwt.expiration-ms=900000
# Datasource — H2 in-memory for dev; override with PostgreSQL in production
spring.datasource.url=jdbc:h2:mem:myapi;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=true
